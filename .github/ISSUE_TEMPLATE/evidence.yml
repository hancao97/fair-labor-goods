name: 劳动资料补充与纠正
description: 先推荐有员工反馈的公司，也可补充具体商品和劳动资料
title: "[资料补充] "
body:
  - type: input
    id: subject
    attributes:
      label: 公司或商品线索
      description: 可以只提供公司名及已知岗位、地点；已有商品时再补品牌、型号和生产企业。
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 原始来源
      description: 提供公开员工帖子、采访、制度或其他资料链接，以及发布日期、相关段落或 PDF 页码。
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: 员工反馈的范围
      description: 是亲身经历、媒体采访、转载还是内推介绍？涉及什么时期、岗位和工作地点？有无不同员工的相反反馈？未知可留空。
  - type: textarea
    id: domestic
    attributes:
      label: 大陆购买与中国生产依据
      description: 已找到商品时再提供具体购买入口，以及生产商、厂址或境内服务来源。公司线索可先留空。
    validations:
      required: false
  - type: textarea
    id: schedule
    attributes:
      label: 工时、休息与例外
      description: 分别说明生产岗位的标准工时、实际加班、轮休、工资、社保等；政府评级须列法人和年度。未知部分请明确写出。
    validations:
      required: true
  - type: textarea
    id: supply
    attributes:
      label: 商品和供应链关联
      description: 制造商、开发商、发行商或外包团队是谁？有什么公开资料证明与该商品对应？
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开信息检查
      options:
        - label: 我已隐去与公开核验无关的个人信息，未提交未经允许的内部材料。
          required: true
